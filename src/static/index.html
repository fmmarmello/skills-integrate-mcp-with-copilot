<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atividades da Mergington High School</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Mergington High School</h1>
        <h2>Atividades Extracurriculares</h2>
      </div>
      <button id="login-button" class="login-button" type="button" aria-expanded="false">
        <span aria-hidden="true">👤</span>
        <span id="login-button-text">Login do professor</span>
      </button>
    </header>

    <div id="login-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Login do professor</h3>
          <button id="close-login-modal" class="close-button" type="button" aria-label="Fechar login">×</button>
        </div>
        <form id="login-form">
          <div class="form-group">
            <label for="username">Usuário:</label>
            <input type="text" id="username" required placeholder="professor" />
          </div>
          <div class="form-group">
            <label for="password">Senha:</label>
            <input type="password" id="password" required placeholder="••••••••" />
          </div>
          <button type="submit">Entrar</button>
        </form>
      </div>
    </div>

    <main>
      <section id="activities-container">
        <h3>Atividades Disponíveis</h3>
        <div id="activities-list">
          <!-- As atividades serão carregadas aqui -->
          <p>Carregando atividades...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Gerenciar inscrições</h3>
        <p id="teacher-status" class="teacher-status">Faça login como professor para inscrever ou remover estudantes.</p>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">E-mail do estudante:</label>
            <input type="email" id="email" required placeholder="seu-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Selecione a atividade:</label>
            <select id="activity" required>
              <option value="">-- Selecione uma atividade --</option>
              <!-- As opções de atividade serão carregadas aqui -->
            </select>
          </div>
          <button type="submit" id="signup-button">Inscrever-se</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
